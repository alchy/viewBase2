[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "viewbase"
version = "0.1.0"
description = "Amiga Workbench-style pracovní prostředí v prohlížeči ovládané z Pythonu – screeny, okna a živá 2D/3D vizualizace grafů"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    # Zabezpečená okna (`secured=True`) ověřují kód z autentikátoru. Je to
    # STANDARDNÍ závislost, ne extra: instance spuštěná v prostředí bez pyotp
    # spadne na jednorázové kódy a kód z autentikátoru pak vypadá jako
    # neplatný – tichá past, která stála ladění (viz mfa.py).
    "pyotp>=2.9",
    "qrcode>=7.4",
]

[project.urls]
Homepage = "https://github.com/alchy/viewBase"
Repository = "https://github.com/alchy/viewBase"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
    "pyotp>=2.9",
    "qrcode>=7.4",
    # End-to-end testy v prohlížeči (tests/test_e2e_browser.py). Prohlížeč se
    # doinstaluje zvlášť: `playwright install chromium`. Bez něj se ty testy
    # přeskočí – zbytek sady na cizím stroji padat nemá.
    "playwright>=1.40",
]
# Historický extra: `pip install viewbase[mfa]` funguje dál, ale nic navíc
# nepřináší – TOTP je od téhle verze ve standardních závislostech výše.
# Pillow NENÍ potřeba: QR se kreslí jako ASCII a jako SVG.
mfa = [
    "pyotp>=2.9",
    "qrcode>=7.4",
]

# static/ je gitignorované (build artefakt z frontend/), hatchling by ho
# proto z balíčku vynechal – artifacts ho vynutí do wheelu i sdist.
[tool.hatch.build.targets.wheel]
packages = ["viewbase"]
artifacts = ["viewbase/static/**"]

[tool.hatch.build.targets.sdist]
artifacts = ["viewbase/static/**"]

[tool.pytest.ini_options]
testpaths = ["tests"]
